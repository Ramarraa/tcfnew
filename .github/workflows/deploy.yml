name: Deploy Odoo Module

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Sync all modules to Odoo addons path
        run: |
          for dir in */; do
            module="${dir%/}"
            if [ -f "$module/__manifest__.py" ]; then
              echo "Syncing $module"
              rsync -av --delete "$module/" "/opt/odoo19/custom-addons/$module/"
            fi
          done

      - name: Restart Odoo service
        run: sudo systemctl restart odoo19
