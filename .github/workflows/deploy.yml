name: Deploy Odoo Module

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Sync modules to Odoo addons path
        run: |
          rsync -av --delete product_packaging_sale/ /opt/odoo19/custom-addons/product_packaging_sale/
          rsync -av --delete tcf_studio_migration/ /opt/odoo19/custom-addons/tcf_studio_migration/

      - name: Restart Odoo service
        run: sudo systemctl restart odoo
